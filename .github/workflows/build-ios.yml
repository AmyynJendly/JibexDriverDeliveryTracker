name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-prod:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XCGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build production-style simulator app
        run: |
          xcodebuild build \
            -scheme JibexDriverDeliveryTracker \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-release

      - name: Package release artifact
        run: |
          mkdir -p release-artifact
          cp -R build-release/Build/Products/Release-iphonesimulator/JibexDriverDeliveryTracker.app release-artifact/
          zip -r release-app.zip release-artifact

      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-app
          path: release-app.zip

      - name: Verify release output
        run: |
          if [ -d "build-release/Build/Products/Release-iphonesimulator/JibexDriverDeliveryTracker.app" ]; then
            echo "✅ Release build succeeded"
            ls -la build-release/Build/Products/Release-iphonesimulator/JibexDriverDeliveryTracker.app
          else
            echo "❌ Release build failed"
            exit 1
          fi
